name: Check game
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rhodes-pvp-v98
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rhodes-pvp-v98/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Build deployment image
        run: docker build -t ntcg:test ..
