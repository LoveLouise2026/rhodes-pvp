services:
  game:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${PUBLISHED_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
